<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Password</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h1>Generate Password</h1>
        <p class="subtitle">Create new 2-week access passwords</p>

        <button class="btn" onclick="generatePassword()">Generate New Password</button>

        <div id="message"></div>

        <div id="activePasswordsSection" style="display: none;">
            <h3 style="margin-top: 30px; color: #333;">Active Passwords</h3>
            <div id="activePasswordsList"></div>
            <button class="btn secondary" onclick="deleteAllPasswords()" style="margin-top: 15px;">Delete All Passwords</button>
        </div>

        <a href="landing.html" class="link" style="margin-top: 20px;">Go to Login Page →</a>
    </div>

    <!-- Popup for showing generated password -->
    <div id="popup" class="popup-overlay">
        <div class="popup">
            <h2>Password Generated!</h2>
            <p style="color: #666; margin-bottom: 15px;">Save this password - it's valid for 2 weeks</p>
            <div class="otp-display" id="otpDisplay"></div>
            <div class="expiry-info">
                <strong>Valid for 2 weeks</strong><br>
                Expires: <span id="expiryDate"></span><br>
                <span id="totalPasswords" style="margin-top: 10px; display: block; font-size: 13px;"></span>
            </div>
            <button class="btn" onclick="copyPassword()">Copy Password</button>
            <button class="btn secondary" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
      const API_URL = '/api'; /* relative render.com url */

      async function generatePassword() {
        const messageDiv = document.getElementById('message');

        try {
          messageDiv.className = 'message info';
          messageDiv.textContent = 'Generating password...';

          const response = await fetch(`${API_URL}/generate-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({})
          });

          const data = await response.json();

          if (data.success) {
            // Show popup with password
            document.getElementById('otpDisplay').textContent = data.password;
            document.getElementById('expiryDate').textContent = data.expiryDate;
            document.getElementById('totalPasswords').textContent =
              `Total active passwords: ${data.totalActivePasswords}`;
            document.getElementById('popup').classList.add('active');

            messageDiv.className = 'message success';
            messageDiv.textContent = '✓ Password generated successfully!';

            // Refresh the active passwords list
            loadActivePasswords();
          } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = data.error || 'Failed to generate password';
          }
        } catch (error) {
          messageDiv.className = 'message error';
          messageDiv.textContent = 'Error connecting to server. Make sure the server is running.';
        }
      }

      async function loadActivePasswords() {
        try {
          const response = await fetch(`${API_URL}/check-passwords`);
          const data = await response.json();

          const section = document.getElementById('activePasswordsSection');
          const list = document.getElementById('activePasswordsList');

          if (data.exists && data.count > 0) {
            section.style.display = 'block';
            list.innerHTML = data.passwords.map(p => `
              <div class="password-card">
                <div class="password-card-header">
                  <span class="password-text">${p.password}</span>
                  <button class="delete-btn" onclick="deletePassword('${p.id}')">✕</button>
                </div>
                <div class="password-card-info">
                  <small>Created: ${p.createdAt}</small><br>
                  <small>Expires: ${p.expiryDate}</small><br>
                  <small style="color: ${p.daysRemaining <= 3 ? '#d9534f' : '#5cb85c'};">
                    ${p.daysRemaining} days remaining
                  </small>
                </div>
              </div>
            `).join('');
          } else {
            section.style.display = 'none';
          }
        } catch (error) {
          console.error('Error loading passwords:', error);
        }
      }

      async function deletePassword(id) {
        if (!confirm('Are you sure you want to delete this password?')) {
          return;
        }

        try {
          const response = await fetch(`${API_URL}/delete-password/${id}`, {
            method: 'DELETE'
          });
          const data = await response.json();

          if (data.success) {
            loadActivePasswords();
          }
        } catch (error) {
          console.error('Error deleting password:', error);
        }
      }

      async function deleteAllPasswords() {
        if (!confirm('Are you sure you want to delete ALL passwords? This cannot be undone.')) {
          return;
        }

        try {
          const response = await fetch(`${API_URL}/delete-all-passwords`, {
            method: 'DELETE'
          });
          const data = await response.json();

          if (data.success) {
            loadActivePasswords();
            document.getElementById('message').className = 'message info';
            document.getElementById('message').textContent = 'All passwords deleted';
          }
        } catch (error) {
          console.error('Error deleting passwords:', error);
        }
      }

      function closePopup() {
        document.getElementById('popup').classList.remove('active');
      }

      function copyPassword() {
        const password = document.getElementById('otpDisplay').textContent;
        navigator.clipboard.writeText(password).then(() => {
          alert('Password copied to clipboard!');
        });
      }

      // Load active passwords on page load
      window.onload = function() {
        loadActivePasswords();
      };
    </script>
</body>
</html>
